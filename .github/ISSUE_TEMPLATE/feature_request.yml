name: Proposed improvement
description: Suggest a design or documentation improvement
labels: [enhancement]
body:
  - type: textarea
    id: proposal
    attributes: {label: Proposal}
    validations: {required: true}
  - type: textarea
    id: rationale
    attributes: {label: Rationale and evidence, description: Datasheet, calculation, or test result}
  - type: textarea
    id: impact
    attributes: {label: Impact on schematic / PCB / BOM / fabrication}
